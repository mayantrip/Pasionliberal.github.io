<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanzas MAYAN TRIP</title>

<style>
:root{
  --gold:#d4af37;
  --gold-light:#f4d03f;
  --dark:#0a0a0a;
  --card:#111;
  --border:#222;
  --green:#4ade80;
  --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--dark);
  color:var(--gold);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:80px;
}
.header{
  background:linear-gradient(135deg,#1a1a1a 0%,#0a0a0a 100%);
  padding:16px 15px;
  border-bottom:2px solid var(--gold);
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{font-size:20px;display:flex;align-items:center;gap:8px;}
.header-actions{display:flex;gap:8px;}
.btn-header{
  background:none;
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--gold);
  font-size:18px;
  padding:6px 10px;
  cursor:pointer;
  display:flex;
  align-items:center;
}
.btn-header:active{background:#1a1a1a;}
.total-card{
  background:linear-gradient(135deg,var(--gold) 0%,#b8941f 100%);
  color:#000;
  padding:20px;
  border-radius:15px;
  margin:15px;
  text-align:center;
}
.total-label{font-size:12px;opacity:0.8;text-transform:uppercase;}
.total-monto{font-size:32px;font-weight:bold;margin-top:5px;}
.tabs{
  display:flex;
  gap:5px;
  padding:10px 15px;
  background:#0f0f0f;
  position:sticky;
  top:62px;
  z-index:99;
}
.tab{
  flex:1;
  padding:12px 8px;
  background:#1a1a1a;
  border:1px solid var(--border);
  border-radius:10px;
  color:#666;
  font-size:12px;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
}
.tab.active{
  background:var(--gold);
  color:#000;
  font-weight:bold;
}
.section{display:none;}
.section.active{display:block;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin:10px 15px;
}
.card-title{
  font-size:14px;
  color:var(--gold);
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.cuenta-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.cuenta-item:last-child{border-bottom:none;}
.cuenta-nombre{font-size:14px;flex:1;}
.cuenta-saldo{font-size:16px;font-weight:bold;}
.cuenta-saldo.positive{color:var(--green);}
.cuenta-saldo.negative{color:var(--red);}
.cuenta-acciones{display:flex;gap:4px;align-items:center;margin-left:10px;}
.btn-icono{
  background:none;
  border:none;
  font-size:16px;
  cursor:pointer;
  padding:4px 6px;
  opacity:0.55;
  line-height:1;
}
.btn-icono:hover{opacity:1;}
.btn-nueva-cuenta{
  width:100%;
  padding:12px;
  background:transparent;
  border:1px dashed #333;
  border-radius:10px;
  color:#555;
  font-size:14px;
  cursor:pointer;
  margin-top:10px;
  text-align:center;
}
.btn-nueva-cuenta:hover{border-color:var(--gold);color:var(--gold);}
.btn-fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:50%;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(212,175,55,0.3);
  z-index:1000;
}
.modal{
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.9);
  z-index:2000;
  overflow-y:auto;
}
.modal.active{display:block;}
.modal-content{
  background:var(--dark);
  min-height:100vh;
  padding:20px 15px 100px;
}
.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:15px;
  border-bottom:2px solid var(--gold);
}
.modal-title{font-size:18px;}
.btn-cerrar{
  background:none;
  border:none;
  color:var(--gold);
  font-size:28px;
  cursor:pointer;
}
.form-group{margin-bottom:15px;}
label{
  display:block;
  font-size:12px;
  color:#888;
  margin-bottom:5px;
  text-transform:uppercase;
}
input,select{
  width:100%;
  padding:14px;
  background:#1a1a1a;
  border:1px solid var(--border);
  border-radius:10px;
  color:#fff;
  font-size:16px;
}
input:focus,select:focus{outline:none;border-color:var(--gold);}
.tipo-selector{display:flex;gap:10px;margin-bottom:15px;}
.tipo-btn{
  flex:1;
  padding:15px;
  background:#1a1a1a;
  border:2px solid var(--border);
  border-radius:12px;
  color:#666;
  font-size:14px;
  cursor:pointer;
  transition:all 0.2s;
}
.tipo-btn.active.ingreso{background:rgba(74,222,128,0.2);border-color:var(--green);color:var(--green);}
.tipo-btn.active.gasto{background:rgba(239,68,68,0.2);border-color:var(--red);color:var(--red);}
.tipo-btn.active.transferencia{background:rgba(212,175,55,0.2);border-color:var(--gold);color:var(--gold);}
.btn-guardar{
  width:100%;
  padding:16px;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}
.movimiento-item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  padding-right:80px;
  margin:10px 15px;
  position:relative;
}
.movimiento-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:8px;
}
.movimiento-categoria{
  font-size:12px;
  color:#888;
  background:#1a1a1a;
  padding:4px 10px;
  border-radius:20px;
}
.movimiento-monto{font-size:20px;font-weight:bold;}
.movimiento-monto.ingreso{color:var(--green);}
.movimiento-monto.gasto{color:var(--red);}
.movimiento-monto.transferencia{color:var(--gold);}
.movimiento-detalle{font-size:13px;color:#aaa;margin-top:5px;}
.movimiento-fecha{font-size:11px;color:#666;margin-top:8px;}
.movimiento-acciones{
  position:absolute;
  top:10px;right:8px;
  display:flex;flex-direction:column;gap:2px;
}
.empty-state{text-align:center;padding:40px 20px;opacity:0.5;}
.foto-recibo{
  width:100%;max-height:200px;object-fit:cover;
  border-radius:10px;margin-top:10px;
  cursor:pointer;transition:transform 0.2s;
}
.filtros{
  display:flex;gap:8px;
  padding:0 15px 10px;overflow-x:auto;
}
.filtro-btn{
  padding:8px 16px;background:#1a1a1a;
  border:1px solid var(--border);border-radius:20px;
  color:#888;font-size:12px;white-space:nowrap;cursor:pointer;
}
.filtro-btn.active{background:var(--gold);color:#000;}
.saldo-insuficiente{
  background:rgba(239,68,68,0.1);border:1px solid var(--red);
  color:var(--red);padding:12px;border-radius:8px;
  font-size:13px;margin-bottom:15px;display:none;
}
.saldo-insuficiente.active{display:block;}
.cat-tabs{display:flex;gap:8px;margin-bottom:16px;}
.cat-tab{
  flex:1;padding:12px;background:#1a1a1a;
  border:2px solid var(--border);border-radius:10px;
  color:#666;font-size:13px;cursor:pointer;text-align:center;
  transition:all 0.2s;
}
.cat-tab.active.ingreso{background:rgba(74,222,128,0.15);border-color:var(--green);color:var(--green);}
.cat-tab.active.gasto{background:rgba(239,68,68,0.15);border-color:var(--red);color:var(--red);}
.cat-grupo{
  background:#0d0d0d;border:1px solid var(--border);
  border-radius:10px;margin-bottom:10px;overflow:hidden;
}
.cat-padre-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 12px;background:#161616;
}
.cat-padre-nombre{font-size:14px;font-weight:500;}
.cat-hijo-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 12px 9px 26px;border-top:1px solid #1a1a1a;
}
.cat-hijo-nombre{font-size:13px;color:#aaa;}
.cat-acciones{display:flex;gap:2px;}
.modal-sub{
  display:none;
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.85);z-index:3000;overflow-y:auto;
}
.modal-sub.active{display:block;}
</style>
</head>
<body>

<div class="header">
  <h1>💰 MAYAN TRIP</h1>
  <div class="header-actions">
    <button class="btn-header" onclick="abrirModalCategorias()" title="Gestionar categorías">🏷️</button>
    <button class="btn-header" onclick="exportarDatos()" title="Exportar datos">📤</button>
    <label class="btn-header" title="Importar datos" style="margin:0;cursor:pointer;">
      📥<input type="file" id="fileImport" accept=".json" style="display:none" onchange="importarDatos(event)">
    </label>
  </div>
</div>

<div class="total-card">
  <div class="total-label">Balance Total</div>
  <div class="total-monto" id="totalBalance">$0.00</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="cambiarTab('cuentas', this)">Cuentas</div>
  <div class="tab" onclick="cambiarTab('movimientos', this)">Movimientos</div>
  <div class="tab" onclick="cambiarTab('reportes', this)">Reportes</div>
</div>

<div id="section-cuentas" class="section active">
  <div class="card">
    <div class="card-title">💳 Tus Cuentas</div>
    <div id="listaCuentas"></div>
    <button class="btn-nueva-cuenta" onclick="abrirModalCuenta(null)">+ Nueva Cuenta</button>
  </div>
</div>

<div id="section-movimientos" class="section">
  <div class="filtros">
    <button class="filtro-btn active" onclick="filtrarMovimientos('todos', this)">Todos</button>
    <button class="filtro-btn" onclick="filtrarMovimientos('ingreso', this)">Ingresos</button>
    <button class="filtro-btn" onclick="filtrarMovimientos('gasto', this)">Gastos</button>
    <button class="filtro-btn" onclick="filtrarMovimientos('hoy', this)">Hoy</button>
  </div>
  <div id="listaMovimientos"></div>
</div>

<div id="section-reportes" class="section">
  <div class="card">
    <div class="card-title">📊 Este Mes</div>
    <div id="reporteMensual"></div>
  </div>
</div>

<button class="btn-fab" onclick="abrirModal()">+</button>

<div id="modalMovimiento" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="tituloModalMov">Nuevo Movimiento</div>
      <button class="btn-cerrar" onclick="cerrarModal()">&times;</button>
    </div>
    <div class="tipo-selector" id="tipoSelectorMov">
      <button class="tipo-btn ingreso" onclick="setTipo('ingreso', this)">Ingreso</button>
      <button class="tipo-btn gasto" onclick="setTipo('gasto', this)">Gasto</button>
      <button class="tipo-btn transferencia" onclick="setTipo('transferencia', this)">Transferir</button>
    </div>
    <div class="saldo-insuficiente" id="alertaSaldo">⚠️ Saldo insuficiente en cuenta origen</div>
    <div class="form-group" id="grupoOrigen" style="display:none;">
      <label>Desde (Origen)</label>
      <select id="origen"></select>
    </div>
    <div class="form-group" id="grupoDestino">
      <label>Hacia (Destino)</label>
      <select id="destino"></select>
    </div>
    <div class="form-group" id="grupoCategoria">
      <label>Categoría</label>
      <select id="categoria" onchange="cargarSubcategorias()"></select>
    </div>
    <div class="form-group" id="grupoSubcategoria">
      <label>Subcategoría (opcional)</label>
      <select id="subcategoria"></select>
    </div>
    <div class="form-group">
      <label>Monto</label>
      <input type="number" id="monto" placeholder="0.00" step="0.01">
    </div>
    <div class="form-group">
      <label>Concepto / Nota</label>
      <input type="text" id="concepto" placeholder="Ej: Tour García">
    </div>
    <div class="form-group">
      <label>Fecha</label>
      <input type="datetime-local" id="fecha">
    </div>
    <div class="form-group">
      <label>Foto del Recibo (opcional)</label>
      <input type="file" id="fotoRecibo" accept="image/*" capture="environment" onchange="previewFoto()">
      <img id="previewFoto" class="foto-recibo" style="display:none;">
    </div>
    <button class="btn-guardar" onclick="guardarMovimiento()">Guardar</button>
  </div>
</div>

<div id="modalCuenta" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="tituloModalCuenta">Nueva Cuenta</div>
      <button class="btn-cerrar" onclick="cerrarModalCuenta()">&times;</button>
    </div>
    <div class="form-group">
      <label>Nombre de la cuenta</label>
      <input type="text" id="cuentaNombre" placeholder="Ej: 💵 Efectivo">
    </div>
    <div class="form-group">
      <label>Saldo actual</label>
      <input type="number" id="cuentaSaldo" placeholder="0.00" step="0.01">
    </div>
    <button class="btn-guardar" onclick="guardarCuenta()">Guardar</button>
  </div>
</div>

<div id="modalCategorias" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">🏷️ Categorías</div>
      <button class="btn-cerrar" onclick="cerrarModalCategorias()">&times;</button>
    </div>
    <div class="cat-tabs">
      <button class="cat-tab active ingreso" id="catTabIngreso" onclick="cambiarTipoCat('ingreso', this)">📈 Ingresos</button>
      <button class="cat-tab gasto" id="catTabGasto" onclick="cambiarTipoCat('gasto', this)">📉 Gastos</button>
    </div>
    <div id="listaCategorias"></div>
    <button class="btn-nueva-cuenta" onclick="abrirFormCat(null, null)" style="margin-top:5px;">+ Nueva Categoría</button>
  </div>
</div>

<div id="modalFormCat" class="modal-sub">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="tituloFormCat">Nueva Categoría</div>
      <button class="btn-cerrar" onclick="cerrarFormCat()">&times;</button>
    </div>
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="catNombre" placeholder="Ej: Ventas de Tours">
    </div>
    <div class="form-group">
      <label>Categoría padre (opcional)</label>
      <select id="catPadre"></select>
    </div>
    <button class="btn-guardar" onclick="guardarCategoria()">Guardar</button>
  </div>
</div>

function exportarDatos(){
  const b=new Blob([JSON.stringify(datos,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='mayan-trip-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}
function importarDatos(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(ev){
    try{
      const imp=JSON.parse(ev.target.result);
      if(!imp.cuentas||!imp.movimientos) throw new Error();
      if(!imp.categorias||!imp.categorias.length) imp.categorias=CATEGORIAS_DEFAULT;
      datos=imp; guardarDatos(); renderCuentas(); renderMovimientos(); renderReportes();
      alert('✅ Datos importados correctamente');
    }catch{ alert('❌ Error al importar: archivo inválido'); }
    e.target.value='';
  };
  r.readAsText(f);
}

function guardarMovimiento(){
  const monto=parseFloat(document.getElementById('monto').value);
  const categoria=document.getElementById('categoria').value;
  const subcategoria=document.getElementById('subcategoria').value;
  const concepto=document.getElementById('concepto').value.trim();
  const fecha=document.getElementById('fecha').value;
  const origen=document.getElementById('origen').value;
  const destino=document.getElementById('destino').value;
  if(!monto||monto<=0){ alert('Ingresa un monto válido'); return; }
  if(tipoActual!=='transferencia'&&!categoria){ alert('Selecciona una categoría'); return; }
  if(!fecha){ alert('Selecciona fecha'); return; }
  if(tipoActual==='ingreso'&&!destino){ alert('Selecciona cuenta destino'); return; }
  if(tipoActual==='gasto'&&!origen){ alert('Selecciona cuenta origen'); return; }
  if(tipoActual==='transferencia'&&(!origen||!destino)){ alert('Selecciona origen y destino'); return; }
  if(tipoActual==='transferencia'&&origen===destino){ alert('Origen y destino deben ser diferentes'); return; }
  if(editandoId){
    const orig=datos.movimientos.find(m=>m.id===editandoId);
    if(orig){
      if(orig.tipo==='ingreso'){ const c=datos.cuentas.find(c=>c.id===orig.destino); if(c) c.saldo-=orig.monto; }
      else if(orig.tipo==='gasto'){ const c=datos.cuentas.find(c=>c.id===orig.origen); if(c) c.saldo+=orig.monto; }
      else{ const co=datos.cuentas.find(c=>c.id===orig.origen),cd=datos.cuentas.find(c=>c.id===orig.destino); if(co) co.saldo+=orig.monto; if(cd) cd.saldo-=orig.monto; }
      datos.movimientos=datos.movimientos.filter(m=>m.id!==editandoId);
    }
    editandoId=null;
  }
  if(tipoActual==='gasto'||tipoActual==='transferencia'){
    const co=datos.cuentas.find(c=>c.id===origen);
    if(co&&co.saldo<monto){ const a=document.getElementById('alertaSaldo'); a.classList.add('active'); a.scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
  }
  const mov={id:Date.now().toString(),tipo:tipoActual,monto,
    categoria:tipoActual==='transferencia'?null:(categoria||null),
    subcategoria:tipoActual==='transferencia'?null:(subcategoria||null),
    concepto,fecha,origen:origen||null,destino:destino||null,foto:fotoBase64,creado:new Date().toISOString()};
  if(tipoActual==='ingreso') datos.cuentas.find(c=>c.id===destino).saldo+=monto;
  else if(tipoActual==='gasto') datos.cuentas.find(c=>c.id===origen).saldo-=monto;
  else{ datos.cuentas.find(c=>c.id===origen).saldo-=monto; datos.cuentas.find(c=>c.id===destino).saldo+=monto; }
  datos.movimientos.push(mov);
  guardarDatos(); cerrarModal(); renderCuentas(); renderMovimientos(); renderReportes();
}

function editarMovimiento(id){
  const m=datos.movimientos.find(x=>x.id===id); if(!m) return;
  editandoId=id; tipoActual=m.tipo; abrirModal();
  setTimeout(()=>{
    setTipo(m.tipo);
    document.getElementById('monto').value=m.monto;
    document.getElementById('concepto').value=m.concepto||'';
    document.getElementById('fecha').value=m.fecha;
    if(m.origen) document.getElementById('origen').value=m.origen;
    if(m.destino) document.getElementById('destino').value=m.destino;
    if(m.categoria){ document.getElementById('categoria').value=m.categoria; cargarSubcategorias(); if(m.subcategoria) document.getElementById('subcategoria').value=m.subcategoria; }
    if(m.foto){ fotoBase64=m.foto; const p=document.getElementById('previewFoto'); p.src=m.foto; p.style.display='block'; }
  },50);
}

function filtrarMovimientos(filtro,el){
  filtroActual=filtro;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); renderMovimientos();
}
function renderMovimientos(){
  const cont=document.getElementById('listaMovimientos');
  let movs=[...datos.movimientos].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  if(filtroActual==='ingreso') movs=movs.filter(m=>m.tipo==='ingreso');
  if(filtroActual==='gasto')   movs=movs.filter(m=>m.tipo==='gasto');
  if(filtroActual==='hoy'){ const h=new Date().toDateString(); movs=movs.filter(m=>new Date(m.fecha).toDateString()===h); }
  if(!movs.length){ cont.innerHTML='<div class="empty-state">Sin movimientos</div>'; return; }
  cont.innerHTML=movs.map(m=>{
    const cat=m.categoria?datos.categorias.find(c=>c.id===m.categoria):null;
    const sub=m.subcategoria?datos.categorias.find(c=>c.id===m.subcategoria):null;
    const co=m.origen?datos.cuentas.find(c=>c.id===m.origen):null;
    const cd=m.destino?datos.cuentas.find(c=>c.id===m.destino):null;
    let det=m.tipo==='ingreso'?`→ ${cd?.nombre||''}`:(m.tipo==='gasto'?`← ${co?.nombre||''}`:`${co?.nombre||''} → ${cd?.nombre||""}`);
    const signo=m.tipo==='ingreso'?'+':(m.tipo==='gasto'?'-':'⇄');
    const etq=cat?`${cat.nombre}${sub?' › '+sub.nombre:''}`:'Transferencia';
    const fec=new Date(m.fecha).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    return `<div class="movimiento-item"><div class="movimiento-acciones"><button class="btn-icono" onclick="editarMovimiento('${m.id}')">✏️</button><button class="btn-icono" onclick="eliminarMovimiento('${m.id}')">🗑</button></div><div class="movimiento-header"><span class="movimiento-categoria">${etq}</span><span class="movimiento-monto ${m.tipo}">${signo}$${m.monto.toFixed(2)}</span></div>${m.concepto?`<div class="movimiento-detalle">${m.concepto}</div>`:''}<div class="movimiento-detalle">${det}</div>${m.foto?`<img src="${m.foto}" class="foto-recibo" onclick="toggleZoom(this)">`:''}<div class="movimiento-fecha">${fec}</div></div>`;
  }).join('');
}
function toggleZoom(img){ img.style.transform=img.style.transform==='scale(2)'?'scale(1)':'scale(2)'; }
function eliminarMovimiento(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  const idx=datos.movimientos.findIndex(m=>m.id===id); if(idx===-1) return;
  const m=datos.movimientos[idx];
  if(m.tipo==='ingreso'){ const c=datos.cuentas.find(c=>c.id===m.destino); if(c) c.saldo-=m.monto; }
  else if(m.tipo==='gasto'){ const c=datos.cuentas.find(c=>c.id===m.origen); if(c) c.saldo+=m.monto; }
  else{ const co=datos.cuentas.find(c=>c.id===m.origen),cd=datos.cuentas.find(c=>c.id===m.destino); if(co) co.saldo+=m.monto; if(cd) cd.saldo-=m.monto; }
  datos.movimientos.splice(idx,1); guardarDatos(); renderCuentas(); renderMovimientos(); renderReportes();
}

function renderReportes(){
  const ahora=new Date(), mes=ahora.getMonth(), anio=ahora.getFullYear();
  const movsMes=datos.movimientos.filter(m=>{ const f=new Date(m.fecha); return f.getMonth()===mes&&f.getFullYear()===anio; });
  const ingresos=movsMes.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gastos=movsMes.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  const balance=ingresos-gastos;
  const gpc={};
  movsMes.filter(m=>m.tipo==='gasto').forEach(m=>{ const cat=m.categoria?datos.categorias.find(c=>c.id===m.categoria):null; const n=cat?cat.nombre:'Sin categoría'; gpc[n]=(gpc[n]||0)+m.monto; });
  let html=`<div style="display:flex;justify-content:space-between;margin-bottom:20px;"><div style="text-align:center;"><div style="font-size:12px;color:#888;">Ingresos</div><div style="color:var(--green);font-size:20px;font-weight:bold;">+$${ingresos.toFixed(2)}</div></div><div style="text-align:center;"><div style="font-size:12px;color:#888;">Gastos</div><div style="color:var(--red);font-size:20px;font-weight:bold;">-$${gastos.toFixed(2)}</div></div><div style="text-align:center;"><div style="font-size:12px;color:#888;">Balance</div><div style="color:${balance>=0?'var(--green)':'var(--red)'};font-size:20px;font-weight:bold;">$${balance.toFixed(2)}</div></div></div><div style="border-top:1px solid var(--border);padding-top:15px;"><div style="font-size:12px;color:#888;margin-bottom:10px;">GASTOS POR CATEGORÍA</div>`;
  const sc=Object.entries(gpc).sort((a,b)=>b[1]-a[1]);
  if(!sc.length) html+='<div style="opacity:0.5;text-align:center;padding:20px;">Sin gastos este mes</div>';
  else sc.forEach(([n,m])=>{ const p=gastos>0?(m/gastos*100).toFixed(1):0; html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);"><span>${n}</span><div style="text-align:right;"><div style="font-weight:bold;">$${m.toFixed(2)}</div><div style="font-size:11px;color:#666;">${p}%</div></div></div>`; });
  html+='</div>';
  document.getElementById('reporteMensual').innerHTML=html;
}

cargarDatos(); renderCuentas(); renderMovimientos(); renderReportes();

document.getElementById('modalCuenta').addEventListener('click',function(e){if(e.target===this)cerrarModalCuenta();});
document.getElementById('modalCategorias').addEventListener('click',function(e){if(e.target===this)cerrarModalCategorias();});
document.getElementById('modalFormCat').addEventListener('click',function(e){if(e.target===this)cerrarFormCat();});
</script>
