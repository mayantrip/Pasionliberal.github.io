<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mi Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(160deg,#0f0f1a 0%,#1a1a2e 60%,#16213e 100%);min-height:100vh;font-family:'Nunito',sans-serif;color:#e0e0f0;}
.app{max-width:420px;margin:0 auto;min-height:100vh;}
button,input,textarea,select{font-family:'Nunito',sans-serif;cursor:pointer;}
.nb{background:rgba(255,255,255,0.06);border:none;color:#e0e0f0;font-size:1.4rem;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.pb{flex:1;background:linear-gradient(135deg,#6C63FF,#a78bfa);border:none;color:#fff;padding:10px 0;border-radius:10px;font-size:.9rem;font-weight:700;}
.gb{flex:1;background:transparent;border:1px solid rgba(108,99,255,0.4);color:#a78bfa;padding:10px 0;border-radius:10px;font-size:.9rem;font-weight:700;}
.bb{background:none;border:none;color:#6C63FF;font-size:.95rem;font-weight:700;margin-bottom:14px;padding:0;}
.is{background:rgba(255,255,255,0.07);border:1px solid rgba(108,99,255,0.3);border-radius:8px;color:#e0e0f0;padding:8px 10px;font-size:.93rem;width:100%;}
.is option{background:#1a1a2e;}
.fab{position:fixed;bottom:28px;right:24px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#6C63FF,#a78bfa);border:none;color:#fff;font-size:1.7rem;box-shadow:0 4px 20px rgba(108,99,255,0.5);display:flex;align-items:center;justify-content:center;}
.view{padding:20px 14px 100px;display:none;}
.view.active{display:block;}
.lsm{font-size:.68rem;color:#888aaa;font-weight:700;display:block;margin-bottom:4px;}
.mb{background:rgba(255,255,255,0.06);border:1px solid rgba(108,99,255,0.25);border-radius:10px;color:#a78bfa;padding:8px 12px;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.mt{width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer;border:2px solid rgba(108,99,255,0.3);}
.mr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.ai-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(108,99,255,0.08);border-radius:10px;margin-top:6px;}
.bnav{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;}
.np{flex:1;min-width:65px;background:rgba(255,255,255,0.05);border:1px solid rgba(108,99,255,0.2);border-radius:12px;color:#a78bfa;padding:10px 0;font-size:.75rem;font-weight:700;text-align:center;}
.np.ai{background:linear-gradient(135deg,rgba(108,99,255,0.35),rgba(167,139,250,0.25));border-color:rgba(108,99,255,0.45);color:#e0e0f0;}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;align-items:center;justify-content:center;}
#lb img,#lb video{max-width:95%;max-height:80vh;border-radius:12px;}
</style>
</head>
<body>
<div class="app">
<div id="view-calendar" class="view active">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
    <button class="nb" onclick="changeMonth(-1)">‹</button>
    <div style="text-align:center;"><div id="mt" style="font-size:1.3rem;font-weight:800;letter-spacing:1px;"></div><div id="yt" style="font-size:.8rem;color:#7778aa;font-weight:600;"></div></div>
    <button class="nb" onclick="changeMonth(1)">›</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;">
    <div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">L</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">M</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">X</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">J</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">V</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">S</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:#6C63FF;">D</div>
  </div>
  <div id="cal-grid"></div>
  <div style="margin:16px 0 12px;border-top:1px solid rgba(108,99,255,0.2);"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
    <span style="font-size:.75rem;font-weight:800;color:#a78bfa;letter-spacing:1px;text-transform:uppercase;">Hoy</span>
    <span id="tp" style="font-size:.7rem;color:#555577;"></span>
  </div>
  <div id="today-list"></div>
  <div class="bnav">
    <button class="np" onclick="showView('notes')">📝 Notas</button>
    <button class="np" onclick="showView('alarms')">⏰ Alarmas</button>
    <button class="np" onclick="showView('media')">🗂️ Archivos</button>
    <button class="np ai" onclick="showAI()">🎙️ IA</button>
  </div>
</div>
<div id="view-agenda" class="view">
  <button class="bb" onclick="showView('calendar')">← Calendario</button>
  <div id="ag-title" style="font-size:1.2rem;font-weight:800;margin-bottom:2px;text-transform:capitalize;"></div>
  <div id="ag-prog" style="font-size:.72rem;color:#555577;margin-bottom:20px;font-weight:600;"></div>
  <div id="ag-list"></div>
  <div id="ag-form" style="display:none;background:rgba(255,255,255,0.05);border:1px solid rgba(108,99,255,0.3);border-radius:16px;padding:16px;margin-top:10px;">
    <label class="lsm">HORA</label><input type="time" id="nh" value="08:00" class="is" style="margin-bottom:10px;display:block;"/>
    <label class="lsm">ACTIVIDAD</label><input type="text" id="nd" placeholder="¿Qué vas a hacer?" class="is" style="margin-bottom:10px;display:block;"/>
    <label class="lsm">RECORDATORIO</label>
    <select id="nr" class="is" style="margin-bottom:10px;display:block;"><option value="0">Sin recordatorio</option><option value="5">5 min antes</option><option value="10">10 min antes</option><option value="15">15 min antes</option><option value="30">30 min antes</option><option value="60">1 hora antes</option></select>
    <label class="lsm">ADJUNTAR</label>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="mb" onclick="document.getElementById('ai-img').click()">📷 Foto</button>
      <button class="mb" onclick="document.getElementById('ai-file').click()">📎 Archivo</button>
      <button class="mb" onclick="toggleVoice()">🎤 Voz</button>
    </div>
    <input type="file" id="ai-img" accept="image/*,video/*" style="display:none;" onchange="handleImg(event,'act')"/>
    <input type="file" id="ai-file" accept="*/*" style="display:none;" onchange="handleFile(event,'act')"/>
    <div id="voice-area" style="display:none;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
        <button id="rec-btn" onclick="toggleRec()" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6C63FF,#a78bfa);border:none;color:#fff;font-size:1.2rem;display:flex;align-items:center;justify-content:center;">🎤</button>
        <span id="rec-st" style="font-size:.82rem;color:#888aaa;">Toca para grabar</span>
      </div>
    </div>
    <div id="act-preview" class="mr"></div>
    <div style="display:flex;gap:8px;margin-top:10px;"><button class="pb" onclick="addAct()">Agregar</button><button class="gb" onclick="hideAgForm()">Cancelar</button></div>
  </div>
  <button class="fab" id="ag-fab" onclick="showAgForm()">+</button>
</div>
<div id="view-notes" class="view">
  <button class="bb" onclick="showView('calendar')">← Inicio</button>
  <div style="font-size:1.3rem;font-weight:800;margin-bottom:14px;">📝 Notas</div>
  <input type="text" id="ns" placeholder="Buscar..." class="is" style="margin-bottom:14px;" oninput="rNotes()"/>
  <div id="notes-list"></div>
  <button class="fab" onclick="openNote('new',null)">+</button>
</div>
<div id="view-note-editor" class="view">
  <button class="bb" onclick="showView('notes')">← Notas</button>
  <input type="text" id="nt" placeholder="Título" class="is" style="font-size:1.1rem;font-weight:700;margin-bottom:10px;display:block;"/>
  <textarea id="nb" placeholder="Escribe tu nota..." class="is" style="min-height:160px;resize:vertical;line-height:1.6;display:block;margin-bottom:12px;"></textarea>
  <label class="lsm">ADJUNTAR</label>
  <div style="display:flex;gap:8px;margin-bottom:10px;">
    <button class="mb" onclick="document.getElementById('ni-img').click()">📷 Foto</button>
    <button class="mb" onclick="document.getElementById('ni-file').click()">📎 Archivo</button>
  </div>
  <input type="file" id="ni-img" accept="image/*,video/*" style="display:none;" onchange="handleImg(event,'note')"/>
  <input type="file" id="ni-file" accept="*/*" style="display:none;" onchange="handleFile(event,'note')"/>
  <div id="note-preview" class="mr" style="margin-bottom:12px;"></div>
  <div style="display:flex;gap:8px;"><button class="pb" onclick="saveNote()">Guardar</button><button class="gb" onclick="showView('notes')">Cancelar</button></div>
</div>
<div id="view-media" class="view">
  <button class="bb" onclick="showView('calendar')">← Inicio</button>
  <div style="font-size:1.3rem;font-weight:800;margin-bottom:4px;">🗂️ Archivos</div>
  <div style="font-size:.75rem;color:#555577;margin-bottom:18px;">Todo lo adjuntado</div>
  <div id="media-gallery"></div>
</div>
<div id="view-alarms" class="view">
  <button class="bb" onclick="showView('calendar')">← Inicio</button>
  <div style="font-size:1.3rem;font-weight:800;margin-bottom:4px;">⏰ Alarmas</div>
  <div style="font-size:.75rem;color:#555577;margin-bottom:20px;">App debe estar abierta</div>
  <div id="alarms-list"></div>
  <div id="al-form" style="display:none;background:rgba(255,255,255,0.05);border:1px solid rgba(108,99,255,0.3);border-radius:16px;padding:16px;margin-top:10px;">
    <label class="lsm">HORA</label><input type="time" id="alh" value="08:00" class="is" style="margin-bottom:10px;display:block;"/>
    <label class="lsm">ETIQUETA</label><input type="text" id="all" placeholder="Ej: Medicina" class="is" style="margin-bottom:10px;display:block;"/>
    <label class="lsm">REPETIR</label>
    <select id="alr" class="is" style="margin-bottom:12px;display:block;"><option value="once">Una vez</option><option value="daily">Cada día</option><option value="weekdays">Lun-Vie</option><option value="weekends">Fin de semana</option></select>
    <div style="display:flex;gap:8px;"><button class="pb" onclick="addAlarm()">Agregar</button><button class="gb" onclick="document.getElementById('al-form').style.display='none';document.getElementById('al-fab').style.display='flex';">Cancelar</button></div>
  </div>
  <button class="fab" id="al-fab" onclick="document.getElementById('al-form').style.display='block';document.getElementById('al-fab').style.display='none';">+</button>
</div>
<div id="ai-panel" style="display:none;position:fixed;inset:0;background:rgba(5,5,15,0.97);z-index:100;flex-direction:column;max-width:420px;margin:0 auto;">
  <div style="padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(108,99,255,0.2);">
    <span style="font-weight:800;font-size:1.1rem;">🤖 Asistente IA</span>
    <button onclick="hideAI()" style="background:none;border:none;color:#ff4466;font-size:1.4rem;">×</button>
  </div>
  <div id="ai-key-form" style="padding:20px 14px;display:none;">
    <div style="font-size:.9rem;color:#a78bfa;margin-bottom:12px;font-weight:700;">🔑 Pega tu Groq API Key</div>
    <div style="font-size:.78rem;color:#555577;margin-bottom:12px;">Se guarda solo en tu navegador, nadie más la ve.</div>
    <input type="text" id="key-input" placeholder="gsk_..." class="is" style="margin-bottom:10px;display:block;"/>
    <button onclick="saveKey()" style="width:100%;background:linear-gradient(135deg,#6C63FF,#a78bfa);border:none;color:#fff;padding:12px;border-radius:10px;font-size:.95rem;font-weight:700;">Guardar key</button>
  </div>
  <div id="ai-msgs" style="flex:1;overflow-y:auto;padding:14px 14px 0;"></div>
  <div style="display:flex;flex-direction:column;align-items:center;padding:16px 14px 8px;">
    <button id="mic-btn" onclick="toggleMic()" style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6C63FF,#a78bfa);border:none;color:#fff;font-size:2rem;box-shadow:0 4px 20px rgba(108,99,255,0.5);display:flex;align-items:center;justify-content:center;">🎙️</button>
    <span id="mic-lbl" style="font-size:.72rem;color:#555577;margin-top:8px;font-weight:700;">Toca para hablar</span>
  </div>
  <div style="padding:8px 14px 24px;display:flex;gap:8px;border-top:1px solid rgba(108,99,255,0.15);">
    <input type="text" id="ai-in" placeholder="O escribe aquí..." onkeydown="if(event.key==='Enter')sendAI()" style="flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(108,99,255,0.3);border-radius:10px;color:#e0e0f0;padding:10px 12px;font-size:.9rem;"/>
    <button onclick="sendAI()" style="background:linear-gradient(135deg,#6C63FF,#a78bfa);border:none;border-radius:10px;color:#fff;padding:0 16px;font-size:1.1rem;">➤</button>
  </div>
</div>
<div id="al-notif" style="display:none;position:fixed;top:0;left:0;right:0;z-index:200;max-width:420px;margin:0 auto;">
  <div style="background:linear-gradient(135deg,#6C63FF,#a78bfa);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(108,99,255,0.6);">
    <div><div style="font-size:1rem;font-weight:800;">⏰ <span id="nl"></span></div><div id="nt2" style="font-size:.8rem;opacity:.85;margin-top:2px;"></div></div>
    <button onclick="document.getElementById('al-notif').style.display='none';" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;font-size:.85rem;">OK</button>
  </div>
</div>
<div id="lb" onclick="document.getElementById('lb').style.display='none';document.getElementById('lb-c').innerHTML='';">
  <button style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:1.5rem;border-radius:50%;width:40px;height:40px;">×</button>
  <div id="lb-c"></div>
</div>
</div>
<script>
const MN=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let td=new Date(),cY=td.getFullYear(),cM=td.getMonth(),sD=null,sY=null,sM=null;
let acts={},notes=[],alarms=[],editN=null,aiMsgs=[{role:"assistant",text:"¡Qué onda! Habla o escribe — agendo lo que me digas 🎙️"}];
let rec=null,listening=false,mRec=null,rChunks=[],isRec=false,fired=new Set(),pAtt=[],pNAtt=[],allMedia=[];
function tk(){return mk(td.getFullYear(),td.getMonth(),td.getDate());}
function mk(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function wn(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const dn=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dn);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
function getKey(){return localStorage.getItem('groq_key');}
function saveKey(){const k=document.getElementById('key-input').value.trim();if(!k)return;localStorage.setItem('groq_key',k);document.getElementById('ai-key-form').style.display='none';addMsg('assistant','¡Key guardada! Ya puedes hablarme o escribirme 🎙️');}
function showView(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+n).classList.add('active');if(n==='calendar'){rCal();rToday();}if(n==='notes')rNotes();if(n==='alarms')rAlarms();if(n==='media')rMedia();window.scrollTo(0,0);}
function rCal(){document.getElementById('mt').textContent=MN[cM];document.getElementById('yt').textContent=cY;const g=document.getElementById('cal-grid');g.innerHTML='';let sd=(new Date(cY,cM,1).getDay()+6)%7,tot=new Date(cY,cM+1,0).getDate(),days=[];for(let i=0;i<sd;i++)days.push(null);for(let d=1;d<=tot;d++)days.push(d);let i=0;while(i<days.length){const w=days.slice(i,i+7),r=document.createElement('div');r.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;';const fr=w.find(d=>d!==null),wnum=fr?wn(new Date(cY,cM,fr)):null;w.forEach((d,ix)=>{const c=document.createElement('div'),it=d===td.getDate()&&cM===td.getMonth()&&cY===td.getFullYear(),dot=d&&acts[mk(cY,cM,d)]?.length>0;c.style.cssText=`position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;border-radius:10px;background:${it?'#6C63FF':'transparent'};cursor:${d?'pointer':'default'};`;if(ix===0&&wnum){const wl=document.createElement('span');wl.style.cssText=`position:absolute;top:2px;left:3px;font-size:.5rem;color:${it?'rgba(255,255,255,0.6)':'rgba(150,150,200,0.5)'};font-family:monospace;font-weight:700;`;wl.textContent='S'+wnum;c.appendChild(wl);}const n=document.createElement('span');n.style.cssText=`font-size:.9rem;font-weight:${it?800:400};color:${d?(it?'#fff':'#dde0f5'):'transparent'};`;n.textContent=d||'';c.appendChild(n);if(dot){const dt=document.createElement('span');dt.style.cssText=`width:4px;height:4px;border-radius:50%;background:${it?'#fff':'#a78bfa'};margin-top:1px;`;c.appendChild(dt);}if(d)c.onclick=()=>openDay(d);r.appendChild(c);});g.appendChild(r);i+=7;}}
function changeMonth(d){cM+=d;if(cM<0){cM=11;cY--;}if(cM>11){cM=0;cY++;}rCal();}
function openDay(d){sD=d;sY=cY;sM=cM;document.getElementById('ag-title').textContent=new Date(sY,sM,sD).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});document.getElementById('ag-form').style.display='none';document.getElementById('ag-fab').style.display='flex';rAgList();showView('agenda');}
function rToday(){const k=tk(),l=acts[k]||[];document.getElementById('tp').textContent=`${l.filter(a=>a.done).length}/${l.length} hechas`;const el=document.getElementById('today-list');if(l.length===0){el.innerHTML=`<div onclick="openDay(${td.getDate()})" style="text-align:center;color:#444466;font-size:.85rem;padding-top:8px;cursor:pointer;">Sin actividades hoy 👻<br/><span style="color:#6C63FF;font-size:.78rem;">Toca para agregar</span></div>`;return;}el.innerHTML='';l.forEach(a=>{const div=document.createElement('div');div.style.cssText=`display:flex;align-items:center;gap:10px;padding:10px 12px;background:${a.done?'rgba(108,99,255,0.07)':'rgba(255,255,255,0.04)'};border-radius:12px;margin-bottom:8px;border:1px solid ${a.done?'rgba(108,99,255,0.25)':'rgba(255,255,255,0.06)'};`;div.innerHTML=`<span style="font-size:.72rem;color:#6C63FF;font-weight:700;min-width:38px;">${a.hour}</span><span style="flex:1;font-size:.88rem;text-decoration:${a.done?'line-through':'none'};color:${a.done?'#44445a':'#dde0f5'};">${a.desc}</span><input type="checkbox" ${a.done?'checked':''} style="width:18px;height:18px;accent-color:#6C63FF;" onchange="tgToday('${a.id}')"/>`;el.appendChild(div);});}
function tgToday(id){const k=tk();acts[k]=(acts[k]||[]).map(a=>a.id===id?{...a,done:!a.done}:a);rToday();}
function ak(){return sD?mk(sY,sM,sD):null;}
function rAgList(){const k=ak(),l=acts[k]||[];document.getElementById('ag-prog').textContent=l.length===0?'Sin actividades':`${l.filter(a=>a.done).length}/${l.length} completadas`;const el=document.getElementById('ag-list');if(l.length===0){el.innerHTML=`<div style="text-align:center;color:#444466;margin-top:40px;font-size:.88rem;">Nada por aquí 👻<br/><span style="color:#a78bfa;font-size:.78rem;">Toca + para agregar</span></div>`;return;}el.innerHTML='';l.forEach(a=>{const div=document.createElement('div');div.style.cssText=`padding:11px 12px;background:${a.done?'rgba(108,99,255,0.08)':'rgba(255,255,255,0.04)'};border-radius:13px;margin-bottom:9px;border:1px solid ${a.done?'rgba(108,99,255,0.3)':'rgba(255,255,255,0.07)'};`;let mh='';if(a.att?.length>0){mh='<div class="mr" style="margin-top:8px;">';a.att.forEach(t=>{if(t.type==='image')mh+=`<img src="${t.url}" class="mt" onclick="openLB('image','${t.url}')"/>`;else if(t.type==='video')mh+=`<video src="${t.url}" class="mt"></video>`;else if(t.type==='audio')mh+=`<div class="ai-item"><span>🎤</span><audio controls src="${t.url}" style="flex:1;height:32px;"></audio></div>`;else mh+=`<a href="${t.url}" download="${t.name}" style="color:#a78bfa;font-size:.78rem;background:rgba(108,99,255,0.1);padding:4px 8px;border-radius:6px;text-decoration:none;">📎${t.name}</a>`;});mh+='</div>';}div.innerHTML=`<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:.72rem;color:#6C63FF;font-weight:700;min-width:38px;">${a.hour}</span><span style="flex:1;font-size:.88rem;text-decoration:${a.done?'line-through':'none'};color:${a.done?'#44445a':'#dde0f5'};">${a.desc}</span>${a.reminder>0?`<span style="font-size:.62rem;color:#a78bfa;">🔔${a.reminder}m</span>`:''}<input type="checkbox" ${a.done?'checked':''} style="width:18px;height:18px;accent-color:#6C63FF;" onchange="tgAct('${a.id}')"/><button onclick="delAct('${a.id}')" style="background:none;border:none;color:#ff4466;font-size:1.1rem;padding:0;">×</button></div>${mh}`;el.appendChild(div);});}
function showAgForm(){pAtt=[];document.getElementById('act-preview').innerHTML='';document.getElementById('voice-area').style.display='none';document.getElementById('ag-form').style.display='block';document.getElementById('ag-fab').style.display='none';document.getElementById('nd').focus();}
function hideAgForm(){document.getElementById('ag-form').style.display='none';document.getElementById('ag-fab').style.display='flex';}
function handleImg(e,t){const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),tp=f.type.startsWith('video')?'video':'image';if(t==='act'){pAtt.push({type:tp,url,name:f.name});rActPrev();}else{pNAtt.push({type:tp,url,name:f.name});rNotePrev();}addMedia({type:tp,url,name:f.name});e.target.value='';}
function handleFile(e,t){const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);if(t==='act'){pAtt.push({type:'file',url,name:f.name});rActPrev();}else{pNAtt.push({type:'file',url,name:f.name});rNotePrev();}addMedia({type:'file',url,name:f.name});e.target.value='';}
function rActPrev(){const el=document.getElementById('act-preview');el.innerHTML='';pAtt.forEach(a=>{if(a.type==='image')el.innerHTML+=`<img src="${a.url}" class="mt"/>`;else if(a.type==='audio')el.innerHTML+=`<div class="ai-item"><span>🎤</span><audio controls src="${a.url}" style="height:32px;flex:1;"></audio></div>`;else el.innerHTML+=`<span style="font-size:.78rem;color:#a78bfa;background:rgba(108,99,255,0.1);padding:4px 8px;border-radius:6px;">📎${a.name}</span>`;});}
function rNotePrev(){const el=document.getElementById('note-preview');el.innerHTML='';pNAtt.forEach(a=>{if(a.type==='image')el.innerHTML+=`<img src="${a.url}" class="mt"/>`;else el.innerHTML+=`<span style="font-size:.78rem;color:#a78bfa;background:rgba(108,99,255,0.1);padding:4px 8px;border-radius:6px;">📎${a.name}</span>`;});}
function toggleVoice(){const a=document.getElementById('voice-area');a.style.display=a.style.display==='none'?'block':'none';}
async function toggleRec(){if(isRec){mRec.stop();isRec=false;document.getElementById('rec-btn').textContent='🎤';document.getElementById('rec-st').textContent='Toca para grabar';return;}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rChunks=[];mRec=new MediaRecorder(s);mRec.ondataavailable=e=>rChunks.push(e.data);mRec.onstop=()=>{const blob=new Blob(rChunks,{type:'audio/webm'}),url=URL.createObjectURL(blob);pAtt.push({type:'audio',url,name:'voz.webm'});addMedia({type:'audio',url,name:'Nota de voz'});rActPrev();s.getTracks().forEach(t=>t.stop());};mRec.start();isRec=true;document.getElementById('rec-btn').textContent='⏹';document.getElementById('rec-btn').style.background='linear-gradient(135deg,#ff4466,#ff6688)';document.getElementById('rec-st').textContent='Grabando...';}catch(e){document.getElementById('rec-st').textContent='Sin acceso al micrófono';}}
function addAct(){const h=document.getElementById('nh').value,d=document.getElementById('nd').value.trim(),r=parseInt(document.getElementById('nr').value)||0;if(!d)return;const k=ak(),l=acts[k]||[];l.push({id:Date.now().toString(),hour:h,desc:d,done:false,reminder:r,att:[...pAtt]});l.sort((a,b)=>a.hour.localeCompare(b.hour));acts[k]=l;document.getElementById('nd').value='';document.getElementById('nh').value='08:00';document.getElementById('nr').value='0';pAtt=[];hideAgForm();rAgList();rCal();if(r>0)schedRem(k,h,d,r);}
function addActAI(key,h,d){const l=acts[key]||[];l.push({id:Date.now().toString(),hour:h,desc:d,done:false,reminder:0,att:[]});l.sort((a,b)=>a.hour.localeCompare(b.hour));acts[key]=l;rCal();rToday();}
function schedRem(dk,h,d,m){const[y,mo,day]=dk.split('-').map(Number),[hh,mm]=h.split(':').map(Number),diff=new Date(y,mo-1,day,hh,mm,0)-new Date()-m*60000;if(diff>0)setTimeout(()=>fireNotif(`En ${m}min: ${d}`,h),diff);}
function tgAct(id){const k=ak();acts[k]=(acts[k]||[]).map(a=>a.id===id?{...a,done:!a.done}:a);rAgList();}
function delAct(id){const k=ak();acts[k]=(acts[k]||[]).filter(a=>a.id!==id);rAgList();rCal();}
function addMedia(item){allMedia.unshift({...item,id:Date.now().toString(),date:new Date().toLocaleDateString('es-MX')});}
function rMedia(){const el=document.getElementById('media-gallery');if(allMedia.length===0){el.innerHTML=`<div style="text-align:center;color:#444466;margin-top:40px;font-size:.88rem;">Sin archivos 📭</div>`;return;}const vis=allMedia.filter(m=>m.type==='image'||m.type==='video'),oth=allMedia.filter(m=>m.type!=='image'&&m.type!=='video');let h='';if(vis.length>0){h+=`<div style="font-size:.72rem;font-weight:800;color:#a78bfa;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Fotos y Videos</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px;">`;vis.forEach(m=>{h+=m.type==='image'?`<img src="${m.url}" onclick="openLB('image','${m.url}')" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid rgba(108,99,255,0.2);"/>`:`<video src="${m.url}" onclick="openLB('video','${m.url}')" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid rgba(108,99,255,0.2);"></video>`;});h+=`</div>`;}if(oth.length>0){h+=`<div style="font-size:.72rem;font-weight:800;color:#a78bfa;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Otros</div>`;oth.forEach(m=>{h+=m.type==='audio'?`<div class="ai-item" style="margin-bottom:8px;"><span>🎤</span><audio controls src="${m.url}" style="flex:1;height:32px;"></audio></div>`:`<a href="${m.url}" download="${m.name}" style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(108,99,255,0.15);border-radius:12px;padding:10px 14px;color:#e0e0f0;text-decoration:none;margin-bottom:8px;"><span style="font-size:1.4rem;">📎</span><div><div style="font-size:.88rem;font-weight:700;">${m.name}</div><div style="font-size:.65rem;color:#555577;">${m.date}</div></div></a>`;});}el.innerHTML=h;}
function openLB(t,u){document.getElementById('lb-c').innerHTML=t==='image'?`<img src="${u}"/>`:`<video src="${u}" controls autoplay style="max-width:95%;max-height:80vh;border-radius:12px;"></video>`;document.getElementById('lb').style.display='flex';}
function rNotes(){const s=(document.getElementById('ns')?.value||'').toLowerCase(),f=notes.filter(n=>n.title.toLowerCase().includes(s)||n.body.toLowerCase().includes(s)),el=document.getElementById('notes-list');if(f.length===0){el.innerHTML=`<div style="text-align:center;color:#444466;margin-top:40px;font-size:.88rem;">Sin notas 📭<br/><span style="color:#a78bfa;font-size:.78rem;">Toca + para crear</span></div>`;return;}el.innerHTML='';f.forEach(n=>{const div=document.createElement('div');div.style.cssText='background:rgba(255,255,255,0.04);border:1px solid rgba(108,99,255,0.18);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;';div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;"><span style="font-weight:700;font-size:.95rem;flex:1;">${n.title||'Sin título'}${n.att?.length>0?`<span style="font-size:.65rem;color:#6C63FF;margin-left:6px;">📎${n.att.length}</span>`:''}</span><button onclick="event.stopPropagation();notes=notes.filter(x=>x.id!=='${n.id}');rNotes();" style="background:none;border:none;color:#ff4466;font-size:1rem;margin-left:8px;">×</button></div>${n.body?`<div style="font-size:.8rem;color:#777799;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${n.body}</div>`:''}<div style="font-size:.68rem;color:#444466;margin-top:6px;">${n.date}</div>`;div.onclick=()=>openNote(n.id,n);el.appendChild(div);});}
function openNote(id,note){editN=id;pNAtt=note?.att?[...note.att]:[];document.getElementById('nt').value=note?.title||'';document.getElementById('nb').value=note?.body||'';rNotePrev();showView('note-editor');}
function saveNote(){const t=document.getElementById('nt').value.trim(),b=document.getElementById('nb').value.trim();if(!t&&!b){showView('notes');return;}if(editN==='new')notes.unshift({id:Date.now().toString(),title:t,body:b,date:new Date().toLocaleDateString('es-MX'),att:[...pNAtt]});else notes=notes.map(n=>n.id===editN?{...n,title:t,body:b,att:[...pNAtt]}:n);pNAtt=[];showView('notes');}
function rAlarms(){const el=document.getElementById('alarms-list');if(alarms.length===0){el.innerHTML=`<div style="text-align:center;color:#444466;margin-top:40px;font-size:.88rem;">Sin alarmas ⏰<br/><span style="color:#a78bfa;font-size:.78rem;">Toca + para agregar</span></div>`;return;}el.innerHTML='';alarms.forEach(a=>{const div=document.createElement('div');div.style.cssText=`display:flex;align-items:center;gap:10px;padding:12px 14px;background:${a.active?'rgba(108,99,255,0.08)':'rgba(255,255,255,0.04)'};border-radius:13px;margin-bottom:9px;border:1px solid ${a.active?'rgba(108,99,255,0.4)':'rgba(108,99,255,0.15)'};opacity:${a.active?1:0.45};`;const rl={once:'Una vez',daily:'Cada día',weekdays:'Lun-Vie',weekends:'Fin de semana'}[a.repeat]||'';div.innerHTML=`<div style="flex:1;"><div style="font-size:1.4rem;font-weight:800;">${a.hour}</div><div style="font-size:.8rem;color:#a78bfa;margin-top:2px;">${a.label} · ${rl}</div></div><label style="position:relative;display:inline-block;width:46px;height:26px;"><input type="checkbox" ${a.active?'checked':''} onchange="alarms=alarms.map(x=>x.id==='${a.id}'?{...x,active:!x.active}:x);rAlarms();" style="opacity:0;width:0;height:0;position:absolute;"/><span style="position:absolute;inset:0;border-radius:13px;background:${a.active?'linear-gradient(135deg,#6C63FF,#a78bfa)':'rgba(255,255,255,0.1)'};"></span><span style="position:absolute;top:3px;left:${a.active?'23px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;"></span></label><button onclick="alarms=alarms.filter(x=>x.id!=='${a.id}');rAlarms();" style="background:none;border:none;color:#ff4466;font-size:1.1rem;padding:0 0 0 8px;">×</button>`;el.appendChild(div);});}
function addAlarm(){const h=document.getElementById('alh').value,l=document.getElementById('all').value.trim()||'Alarma',r=document.getElementById('alr').value;alarms.push({id:Date.now().toString(),hour:h,label:l,repeat:r,active:true});document.getElementById('alh').value='08:00';document.getElementById('all').value='';document.getElementById('al-form').style.display='none';document.getElementById('al-fab').style.display='flex';rAlarms();}
function chkAlarms(){const n=new Date(),ts=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,dw=n.getDay();alarms.forEach(a=>{if(!a.active||a.hour!==ts)return;const k=`${a.id}-${ts}-${n.toDateString()}`;if(fired.has(k))return;const ok=a.repeat==='once'||a.repeat==='daily'||(a.repeat==='weekdays'&&dw>=1&&dw<=5)||(a.repeat==='weekends'&&(dw===0||dw===6));if(ok){fired.add(k);fireNotif(a.label,ts);if(a.repeat==='once'){alarms=alarms.map(x=>x.id===a.id?{...x,active:false}:x);rAlarms();}}});}
function fireNotif(l,t){document.getElementById('nl').textContent=l;document.getElementById('nt2').textContent=t;document.getElementById('al-notif').style.display='block';if(navigator.vibrate)navigator.vibrate([500,200,500,200,500]);try{const c=new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<3;i++){const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime+i*.4);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.4+.3);o.start(c.currentTime+i*.4);o.stop(c.currentTime+i*.4+.3);}}catch(e){}}
function showAI(){const panel=document.getElementById('ai-panel');panel.style.display='flex';if(!getKey()){document.getElementById('ai-key-form').style.display='block';}rAIMsgs();}
function hideAI(){document.getElementById('ai-panel').style.display='none';}
function rAIMsgs(){const el=document.getElementById('ai-msgs');el.innerHTML='';aiMsgs.forEach(m=>{const d=document.createElement('div');d.style.cssText=`display:flex;justify-content:${m.role==='user'?'flex-end':'flex-start'};margin-bottom:10px;`;const b=document.createElement('div');b.style.cssText=`max-width:82%;padding:10px 14px;border-radius:${m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px'};background:${m.role==='user'?'linear-gradient(135deg,#6C63FF,#a78bfa)':'rgba(255,255,255,0.07)'};font-size:.88rem;line-height:1.5;color:#e0e0f0;white-space:pre-wrap;`;b.textContent=m.text;d.appendChild(b);el.appendChild(d);});el.scrollTop=el.scrollHeight;}
function addMsg(r,t){aiMsgs.push({role:r,text:t});rAIMsgs();}
async function sendAI(){const i=document.getElementById('ai-in'),t=i.value.trim();if(!t)return;i.value='';await procAI(t);}
async function procAI(text){
const key=getKey();if(!key){addMsg('assistant','Primero guarda tu Groq API Key arriba 🔑');return;}
addMsg('user',text);const ts=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const ld=document.createElement('div');ld.style.cssText='color:#6C63FF;font-size:.85rem;margin-bottom:10px;padding-left:4px;';ld.textContent='Procesando...';document.getElementById('ai-msgs').appendChild(ld);
try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:`Eres un asistente personal. Hoy es ${ts}. Si el usuario quiere agendar, responde con: <AGENDA>{"date":"YYYY-MM-DD","hour":"HH:MM","desc":"texto"}</AGENDA>. Reglas: mañana=día siguiente, el lunes/etc=próximo, sin fecha=hoy, sin hora=09:00, 3 tarde=15:00, mediodía=12:00, a las 5=17:00, 8 mañana=08:00. Si no es agenda, responde normal en español.`},...aiMsgs.map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}))]})});
const data=await r.json();ld.remove();const full=data.choices[0].message.content||'No entendí';const match=full.match(/<AGENDA>(.*?)<\/AGENDA>/s);let disp=full.replace(/<AGENDA>.*?<\/AGENDA>/s,'').trim();
if(match){try{const{date,hour,desc}=JSON.parse(match[1]);const[y,m,d]=date.split('-').map(Number);addActAI(mk(y,m-1,d),hour,desc);disp+=`\n\n✅ Agendé "${desc}" el ${new Date(y,m-1,d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} a las ${hour}.`;}catch(e){disp+='\n\n⚠️ No pude agendar.';}}
addMsg('assistant',disp);}catch(e){ld.remove();addMsg('assistant','Error de conexión. Verifica tu key.');}}
function toggleMic(){if(listening){stopMic();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMsg('assistant','Usa Chrome para voz.');return;}rec=new SR();rec.lang='es-MX';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{listening=true;document.getElementById('mic-btn').style.background='linear-gradient(135deg,#ff4466,#ff6688)';document.getElementById('mic-btn').textContent='⏹';document.getElementById('mic-lbl').textContent='Escuchando...';document.getElementById('mic-lbl').style.color='#ff6688';};rec.onresult=e=>{stopMic();procAI(e.results[0][0].transcript);};rec.onerror=()=>stopMic();rec.onend=()=>stopMic();rec.start();}
function stopMic(){rec?.stop();listening=false;document.getElementById('mic-btn').style.background='linear-gradient(135deg,#6C63FF,#a78bfa)';document.getElementById('mic-btn').style.boxShadow='0 4px 20px rgba(108,99,255,0.5)';document.getElementById('mic-btn').textContent='🎙️';document.getElementById('mic-lbl').textContent='Toca para hablar';document.getElementById('mic-lbl').style.color='#555577';}
rCal();rToday();setInterval(chkAlarms,10000);chkAlarms();
</script>
