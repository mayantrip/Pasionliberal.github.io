<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agenda Gold</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:#d4af37;
  font-family:sans-serif;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
}

#title{
  flex:1;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase;
}

.header button{
  width:60px;
  height:45px;
  border-radius:10px;
  border:none;
  background:#d4af37;
  cursor:pointer;
  transition:all 0.3s;
}

.header button:hover{
  background:#b8962e;
  transform:scale(1.05);
}

/* CALENDARIO */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  padding:10px;
}

.day-name{
  text-align:center;
  font-size:12px;
  opacity:.7;
}

.day{
  position:relative;
  height:80px;
  border-radius:15px;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
  transition:all 0.3s;
}

.day:hover{
  background:#252525;
  transform:scale(1.02);
}

.day.mark{
  border:2px solid #d4af37;
}

.week{
  position:absolute;
  bottom:5px;
  left:6px;
  font-size:10px;
  opacity:.6;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  flex-direction:column;
  padding:10px;
  overflow:auto;
  z-index:1000;
}

/* HORAS */
.slot{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:3px;
}

.slot span{
  width:55px;
  font-size:12px;
  opacity:.7;
}

input{
  flex:1;
  background:#111;
  border:1px solid #333;
  color:#d4af37;
  padding:6px;
  border-radius:6px;
}

input:focus{
  outline:none;
  border-color:#d4af37;
}

/* TAREAS */
#tasks{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  background:#111;
  padding:10px;
  border-radius:10px;
}

.task input[type="checkbox"]{
  width:20px;
  height:20px;
  cursor:pointer;
}

/* NOTAS */
#notes{
  width:100%;
  min-height:130px;
  max-height:300px;
  margin-top:10px;
  border-radius:12px;
  padding:12px;
  background:#111;
  border:2px solid #d4af37;
  resize:vertical;
  color:#d4af37;
  font-family:sans-serif;
}

#notes:focus{
  outline:none;
  border-color:#d4af37;
}

/* BOTONES */
.actions{
  margin-top:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

button{
  background:#d4af37;
  border:none;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:all 0.3s;
  color:#000;
}

button:hover{
  background:#b8962e;
  transform:translateY(-2px);
}

/* CONFIRMACIÓN MODAL */
.confirm-modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#1a1a1a;
  border:2px solid #d4af37;
  border-radius:15px;
  padding:25px;
  text-align:center;
  z-index:2000;
  display:none;
  min-width:280px;
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
}

.confirm-modal h3{
  margin:0 0 20px 0;
  color:#d4af37;
}

.confirm-buttons{
  display:flex;
  gap:15px;
  justify-content:center;
}

.confirm-buttons button{
  padding:10px 25px;
}

.confirm-buttons .btn-cancel{
  background:#333;
  color:#d4af37;
}

.confirm-buttons .btn-cancel:hover{
  background:#444;
}

.confirm-buttons .btn-confirm{
  background:#d4af37;
  color:#000;
}

/* BOTONES DE DATOS */
.data-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.data-actions button{
  flex:1;
  min-width:120px;
  font-size:12px;
  padding:10px;
}

/* OVERLAY PARA CERRAR MODAL */
.modal-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  z-index:998;
  display:none;
}
</style>
</head>

<body>

<header class="header">
<button onclick="changeMonth(-1)">◀</button>
<h2 id="title"></h2>
<button onclick="changeMonth(1)">▶</button>
</header>

<div class="calendar" id="calendar"></div>

<!-- Overlay para cerrar modal al hacer clic fuera -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>

<div class="modal" id="modal">
<h3 id="dateText"></h3>

<div id="slots"></div>

<h3>Tareas</h3>
<button onclick="addTask()">+ tarea</button>
<div id="tasks"></div>

<h3>Notas</h3>
<textarea id="notes"></textarea>

<div class="actions">
<button onclick="confirmClearDay()">🧹 limpiar día</button>
<button onclick="closeModal()">Cerrar</button>
</div>

<!-- Botones de exportar/importar -->
<div class="data-actions">
<button onclick="exportData()">📤 Exportar datos</button>
<button onclick="document.getElementById('importFile').click()">📥 Importar datos</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
</div>
</div>

<!-- Modal de confirmación -->
<div class="confirm-modal" id="confirmModal">
<h3>⚠️ ¿Estás seguro?</h3>
<p style="margin-bottom:20px;opacity:0.8;">Se eliminará todo el contenido de este día permanentemente.</p>
<div class="confirm-buttons">
<button class="btn-cancel" onclick="cancelClear()">Cancelar</button>
<button class="btn-confirm" onclick="confirmClear()">Sí, limpiar</button>
</div>
</div>

<script>

let date=new Date();
let events={};
let selectedDate="";

function save(){
  localStorage.setItem("agenda",JSON.stringify(events));
}

function load(){
  events=JSON.parse(localStorage.getItem("agenda")||"{}");
}

/* ISO WEEK */
function weekNumber(d){
  let date=new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+4-(date.getDay()||7));
  let yearStart=new Date(date.getFullYear(),0,1);
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}

function hasContent(day){
  return (
    Object.values(day.slots||{}).some(v=>v && v.trim()) ||
    (day.tasks||[]).some(t=>t.text && t.text.trim()) ||
    (day.notes && day.notes.trim())
  );
}

function render(){
  load();

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let y=date.getFullYear();
  let m=date.getMonth();

  document.getElementById("title").innerText=
    date.toLocaleString("es-MX",{month:"long",year:"numeric"}).toUpperCase();

  let days=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  days.forEach(d=>{
    cal.innerHTML+=`<div class="day-name">${d}</div>`;
  });

  let first=new Date(y,m,1);
  let startDay=(first.getDay()+6)%7;

  let last=new Date(y,m+1,0);

  for(let i=0;i<startDay;i++){
    cal.innerHTML+="<div></div>";
  }

  for(let d=1;d<=last.getDate();d++){

    let full=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let isMonday=new Date(y,m,d).getDay()===1;
    let week=weekNumber(full);

    let mark=events[full] && hasContent(events[full]) ? "mark":"";

    cal.innerHTML+=`
      <div class="day ${mark}" onclick="openDay('${full}')">
        ${d}
        ${isMonday?`<span class="week">${week}</span>`:""}
      </div>
    `;
  }
}

function changeMonth(n){
  date.setMonth(date.getMonth()+n);
  render();
}

function openDay(d){
  selectedDate=d;

  if(!events[d]) events[d]={slots:{},tasks:[],notes:""};

  document.getElementById("modal").style.display="flex";
  document.getElementById("modalOverlay").style.display="block";
  document.getElementById("dateText").innerText=d;

  renderSlots();
  renderTasks();
  document.getElementById("notes").value=events[d].notes||"";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
  document.getElementById("modalOverlay").style.display="none";
  render();
}

function renderSlots(){
  let div=document.getElementById("slots");
  div.innerHTML="";

  for(let h=5;h<=23;h++){
    ["00","30"].forEach(m=>{
      let t=`${String(h).padStart(2,"0")}:${m}`;
      let val=events[selectedDate].slots[t]||"";

      div.innerHTML+=`
        <div class="slot">
          <span>${t}</span>
          <input value="${val}" oninput="saveSlot('${t}',this.value)">
        </div>
      `;
    });
  }
}

function saveSlot(t,v){
  events[selectedDate].slots[t]=v;
  save();
  render();
}

function addTask(){
  events[selectedDate].tasks.push({text:"",done:false});
  renderTasks();
  save();
  render();
}

function renderTasks(){
  let div=document.getElementById("tasks");
  div.innerHTML="";

  events[selectedDate].tasks.forEach((t,i)=>{
    div.innerHTML+=`
      <div class="task">
        <input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${i})">
        <input type="text" value="${t.text}" oninput="editTask(${i},this.value)">
      </div>
    `;
  });
}

function toggleTask(i){
  events[selectedDate].tasks[i].done=!events[selectedDate].tasks[i].done;
  save();
  render();
}

function editTask(i,v){
  events[selectedDate].tasks[i].text=v;
  save();
  render();
}

document.getElementById("notes").addEventListener("input",e=>{
  events[selectedDate].notes=e.target.value;
  save();
  render();
});

/* ===== NUEVAS FUNCIONES ===== */

// 1. CONFIRMACIÓN ANTES DE LIMPIAR DÍA
function confirmClearDay(){
  document.getElementById("confirmModal").style.display="block";
}

function cancelClear(){
  document.getElementById("confirmModal").style.display="none";
}

function confirmClear(){
  delete events[selectedDate];
  save();
  document.getElementById("confirmModal").style.display="none";
  closeModal();
}

// 2. CERRAR MODAL AL HACER CLIC FUERA (ya implementado con el overlay)
// La función está en el onclick del modalOverlay

// 3. EXPORTAR E IMPORTAR DATOS
function exportData(){
  const dataStr = JSON.stringify(events, null, 2);
  const dataBlob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(dataBlob);
  const link = document.createElement('a');
  
  const date = new Date();
  const fileName = `agenda_gold_${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}.json`;
  
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  
  alert('✅ Datos exportados correctamente');
}

function importData(input){
  const file = input.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      
      // Validar que sea un objeto
      if(typeof imported !== 'object' || imported === null){
        throw new Error('Formato inválido');
      }
      
      // Confirmar antes de sobrescribir
      const hasData = Object.keys(events).length > 0;
      if(hasData){
        if(!confirm('⚠️ Ya tienes datos guardados. ¿Quieres combinar o reemplazar?\n\nAceptar = Combinar (se unen ambos datos)\nCancelar = Reemplazar todo (se pierden los datos actuales)')){
          events = {};
        }
      }
      
      // Combinar o reemplazar
      Object.assign(events, imported);
      save();
      render();
      
      alert('✅ Datos importados correctamente');
      
      // Recargar el día actual si está abierto
      if(selectedDate && events[selectedDate]){
        renderSlots();
        renderTasks();
        document.getElementById("notes").value=events[selectedDate].notes||"";
      }
      
    } catch(err){
      alert('❌ Error al importar: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = ''; // Reset para poder importar el mismo archivo de nuevo
}

// Cerrar modal de confirmación con ESC
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    document.getElementById("confirmModal").style.display="none";
    closeModal();
  }
});

render();

</script>

</body>
</html>
